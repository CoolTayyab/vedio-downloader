<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Online Video Downloader - MP4 & MP3</title>
<meta name="description" content="Download videos and playlists as MP4 or MP3 for free. Paste a link, choose quality, and download.">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;color:#f1f2f6;
    background:#0f1224 url('/static/background.jpg') center/cover fixed no-repeat;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:100%;max-width:560px;background:rgba(15,18,36,.82);backdrop-filter:blur(8px);border-radius:18px;padding:28px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
  h1{margin:0 0 6px;font-size:1.6rem;background:linear-gradient(90deg,#7c5cff,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  p.sub{margin:0 0 18px;color:#9aa0b4;font-size:.9rem}
  input,select{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:#0f1224;color:#f1f2f6;font-size:.95rem}
  label{display:block;font-size:.8rem;color:#9aa0b4;margin:12px 0 6px}
  .row{display:flex;gap:12px}.row>div{flex:1}
  button{width:100%;margin-top:18px;padding:14px;border:none;border-radius:10px;font-weight:600;font-size:1rem;color:#0f1224;background:linear-gradient(90deg,#22d3ee,#7c5cff);cursor:pointer}
  button:disabled{opacity:.6;cursor:not-allowed}
  #preview-box{display:none;margin-top:14px;gap:12px;align-items:center;background:rgba(255,255,255,.06);border-radius:10px;padding:10px}
  #preview-thumb{width:96px;height:60px;object-fit:cover;border-radius:6px;background:#222}
  #preview-title{font-weight:600;font-size:.9rem}
  #preview-meta{font-size:.78rem;color:#9aa0b4;margin-top:3px}
  #preview-loading{display:none;margin-top:12px;font-size:.85rem;color:#9aa0b4}
  #preview-error{display:none;margin-top:12px;font-size:.85rem;color:#ff6b6b}
  #range-box{display:none;margin-top:6px;padding:12px;border-radius:10px;background:rgba(124,92,255,.12);border:1px solid rgba(124,92,255,.35)}
  #range-box .hint{font-size:.78rem;color:#9aa0b4;margin-top:8px}
  #progress-wrap{display:none;margin-top:18px}
  #progress-track{height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
  #progress-fill{height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#7c5cff);transition:width .3s}
  #progress-label{font-size:.82rem;color:#9aa0b4;margin-top:6px}
  #status{margin-top:12px;font-size:.88rem;min-height:1.2em}
  #status.err{color:#ff6b6b}#status.ok{color:#4ade80}
</style>
</head>
<body>
<div class="card">
  <h1>Video Downloader</h1>
  <p class="sub">Paste a link, pick a format, and download. Playlists are supported (up to 25 videos per batch).</p>

  <input id="url" type="text" placeholder="Paste video or playlist link here..." autocomplete="off">

  <div id="preview-loading">Loading preview...</div>
  <div id="preview-error"></div>
  <div id="preview-box">
    <img id="preview-thumb" alt="">
    <div><div id="preview-title"></div><div id="preview-meta"></div></div>
  </div>

  <div id="range-box">
    <div class="row">
      <div><label style="margin-top:0">From video #</label><input id="range-start" type="number" min="1" value="1"></div>
      <div><label style="margin-top:0">To video #</label><input id="range-end" type="number" min="1" value="25"></div>
    </div>
    <div class="hint" id="range-hint"></div>
  </div>

  <div class="row">
    <div><label>Format</label>
      <select id="type"><option value="mp4">MP4 (video)</option><option value="mp3">MP3 (audio)</option></select></div>
    <div><label>Quality</label>
      <select id="quality"><option value="best">Best</option><option value="1080p">1080p</option><option value="720p">720p</option><option value="480p">480p</option><option value="360p">360p</option></select></div>
  </div>

  <button id="dl-btn">Download</button>
  <button id="cancel-btn" style="display:none;background:#ff5d5d;color:#fff">Stop &amp; save finished videos</button>

  <div id="progress-wrap">
    <div id="progress-track"><div id="progress-fill"></div></div>
    <div id="progress-label"></div>
  </div>
  <div id="status"></div>
</div>

<script>
const MAX_BATCH = 25;
const $ = id => document.getElementById(id);
let currentJob = null, debounce, playlistCount = 0, isPlaylist = false;

function fmtDur(s){ if(!s) return ""; const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }

function updateRangeHint(){
  const s = parseInt($("range-start").value)||1, e = parseInt($("range-end").value)||s;
  const n = e - s + 1;
  let msg = `Selected: ${n>0?n:0} video(s). Max ${MAX_BATCH} per batch.`;
  if (playlistCount > MAX_BATCH) {
    const next = e + 1;
    if (next <= playlistCount) msg += ` Next batch: ${next}-${Math.min(playlistCount, next+MAX_BATCH-1)}.`;
  }
  $("range-hint").textContent = msg;
}
$("range-start").addEventListener("input", () => {
  const s = parseInt($("range-start").value)||1;
  $("range-end").value = Math.min(playlistCount||s+MAX_BATCH-1, s+MAX_BATCH-1);
  updateRangeHint();
});
$("range-end").addEventListener("input", updateRangeHint);

async function fetchPreview(url){
  $("preview-box").style.display="none"; $("preview-error").style.display="none"; $("range-box").style.display="none";
  isPlaylist=false; playlistCount=0;
  if(!/^https?:\/\//i.test(url)) return;
  $("preview-loading").style.display="block";
  try{
    const r = await fetch("/api/info",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})});
    const data = await r.json();
    $("preview-loading").style.display="none";
    if(!r.ok){ $("preview-error").textContent=data.error||"Could not load preview."; $("preview-error").style.display="block"; return; }
    $("preview-thumb").src = data.thumbnail || "";
    $("preview-title").textContent = data.title || "";
    if(data.type==="playlist"){
      isPlaylist=true; playlistCount=data.count;
      $("preview-meta").textContent = `Playlist • ${data.count} videos`;
      if(data.count > MAX_BATCH){
        $("range-start").value=1; $("range-end").value=MAX_BATCH;
        $("range-start").max=data.count; $("range-end").max=data.count;
        $("range-box").style.display="block";
        updateRangeHint();
      }
    } else {
      $("preview-meta").textContent = [data.uploader, fmtDur(data.duration)].filter(Boolean).join(" • ");
    }
    $("preview-box").style.display="flex";
  }catch(e){
    $("preview-loading").style.display="none";
    $("preview-error").textContent="Could not load preview."; $("preview-error").style.display="block";
  }
}
$("url").addEventListener("input", () => { clearTimeout(debounce); debounce=setTimeout(()=>fetchPreview($("url").value.trim()),600); });

function setStatus(msg,cls){ $("status").textContent=msg; $("status").className=cls||""; }

async function pollProgress(jobId){
  while(true){
    const r = await fetch("/api/progress/"+jobId);
    const d = await r.json();
    if(d.status==="cancelled") throw new Error("Download stopped. Nothing was completed yet, so no file was saved.");
    if(d.status==="error") throw new Error(d.error||"Download failed");
    $("progress-fill").style.width=(d.percent||0)+"%";
    $("progress-label").textContent = (d.detail? d.detail+" — ":"") + Math.round(d.percent||0)+"%";
    if(d.status==="finished") return;
    await new Promise(res=>setTimeout(res,800));
  }
}

async function downloadVideo(){
  const url=$("url").value.trim();
  if(!url){ setStatus("Please paste a link first.","err"); return; }
  const body={url,type:$("type").value,quality:$("quality").value};
  if(isPlaylist && playlistCount>MAX_BATCH){
    const s=parseInt($("range-start").value), e=parseInt($("range-end").value);
    if(!s||!e||e<s){ setStatus("Please enter a valid range.","err"); return; }
    if(e-s+1>MAX_BATCH){ setStatus(`Please select at most ${MAX_BATCH} videos at a time.`,"err"); return; }
    body.start=s; body.end=e;
  }
  $("dl-btn").disabled=true; setStatus("");
  $("progress-wrap").style.display="block"; $("progress-fill").style.width="0";
  $("progress-label").textContent="Starting...";
  try{
    const r=await fetch("/api/start-download",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||"Could not start download");
    currentJob = d.job_id; $("cancel-btn").style.display="block";
    await pollProgress(d.job_id);
    $("cancel-btn").style.display="none"; currentJob=null;
    $("progress-label").textContent="Downloading file to your device...";
    const f=await fetch("/api/fetch/"+d.job_id);
    if(!f.ok) throw new Error("Could not fetch file");
    const cd=f.headers.get("Content-Disposition")||"";
    let name="download";
    const m=/filename\*=UTF-8''([^;]+)/i.exec(cd)||/filename="?([^";]+)"?/i.exec(cd);
    if(m) name=decodeURIComponent(m[1]);
    const blob=await f.blob();
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name; a.click();
    setStatus("Done! Check your Downloads folder.","ok");
    $("progress-label").textContent="Complete";
  }catch(e){
    setStatus(e.message,"err"); $("progress-wrap").style.display="none";
  }finally{ $("dl-btn").disabled=false; $("cancel-btn").style.display="none"; currentJob=null; }
}
$("cancel-btn").addEventListener("click",()=>{
  if(currentJob){ fetch("/api/cancel/"+currentJob,{method:"POST"}); $("cancel-btn").disabled=true; $("progress-label").textContent="Stopping... saving the videos that are already finished"; setTimeout(()=>{$("cancel-btn").disabled=false},3000); }
});
// if the user closes/reloads the tab mid-download, stop the server job so it doesn't waste resources
window.addEventListener("pagehide",()=>{ if(currentJob) navigator.sendBeacon("/api/cancel/"+currentJob+"?discard=1"); });
$("dl-btn").addEventListener("click",downloadVideo);
$("url").addEventListener("keydown",e=>{ if(e.key==="Enter") downloadVideo(); });
</script>
</body>
</html>
